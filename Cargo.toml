[package]
name = "lissajous"
description = "A minimalist native notebook library for Rust."
version = "0.19.1"
edition = "2021"
authors = ["Jan-Paul Bultmann <jp@bultmann.eu>"]
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/lissajous"
homepage = "https://lissajous.science"
repository = "https://github.com/erlkonig-ai/lissajous"
include = [
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "INVENTORY.md",
    "src/**/*.rs",
    "examples/*.rs",
    "assets/icon_dark.png",
    "assets/icon_light.png",
    "assets/gorbie.png",
    "assets/syntax/*.tmTheme",
    "assets/datasets/iris.csv",
    "assets/fonts/IosevkaGorbie/IosevkaGorbie-Regular.ttf",
    "assets/fonts/IosevkaGorbie/IosevkaGorbie-Bold.ttf",
    "assets/fonts/IosevkaGorbie/OFL.txt",
    "assets/fonts/Jersey_15/Jersey15-Regular.ttf",
    "assets/fonts/Jersey_15/OFL.txt",
    "assets/fonts/NewComputerModern/NewCMMath-Regular.otf",
    "assets/fonts/NewComputerModern/LICENSE.txt",
]

[dependencies]
lissajous-macros = { version = "0.10.0", path = "gorbie-macros" }
eframe = { version = "0.34", features = ["persistence", "wgpu"] }
egui = { version = "0.34", features = ["color-hex"] }
egui-wgpu = "0.34"
parking_lot = { version = "0.12.3", features = ["arc_lock"] }
log = "0.4.26"
tracing = "0.1.44"
rapier3d-f64 = { version = "=0.35.1", optional = true }
salva3d-f64 = { version = "=0.10.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
dark-light = "2"
png = "0.18"
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Document", "Window", "Element"] }

[dependencies.egui_commonmark]
package = "gorbie-commonmark"
version = "0.24.0"
features = ["better_syntax_highlighting", "svg", "fetch"]
optional = true

[dependencies.egui_plot]
version = "0.35"
optional = true

[dependencies.triblespace]
version = "0.47.0"
optional = true

[dependencies.triblespace-net]
version = "0.47.0"
optional = true

[dependencies.polars]
version = "0.52.0"
optional = true
features = ["lazy", "sql", "polars-ops"]

[dependencies.cubecl]
version = "0.10.0"
package = "maryml-cubecl"
default-features = false
features = ["wgpu", "std"]
optional = true

[dependencies.typst]
version = "0.14"
optional = true

[dependencies.typst-syntax]
version = "0.14"
optional = true

[dependencies.ttf-parser]
version = "0.25"
optional = true

[dependencies.earcutr]
version = "0.5"
optional = true

[dependencies.egui_graphs]
version = "0.29.0"
features = ["events"]
optional = true

[dependencies.comemo]
version = "0.5.1"
optional = true

[features]
default = ["markdown"]
serde = []
accesskit = []
markdown = ["dep:egui_commonmark"]
polars = ["dep:polars"]
plots = ["dep:egui_plot"]
triblespace = ["dep:triblespace"]
cubecl = ["dep:cubecl"]
typst = ["dep:typst", "dep:typst-syntax", "dep:ttf-parser", "dep:earcutr", "dep:comemo"]
telemetry = ["triblespace", "triblespace/telemetry"]
egui_graphs = ["dep:egui_graphs"]
comemo = ["dep:comemo"]
rapier = ["dep:rapier3d-f64"]
salva = ["dep:salva3d-f64"]

[workspace]
members = ["gorbie-macros"]
exclude = ["gorbie_commonmark"]


[dev-dependencies]
ed25519-dalek = "2.1.1"
petgraph = "0.8.3"
rand_core = "0.9.5"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
hifitime = "4.2.3"
tempfile = "3.26"

[[example]]
name = "globe"

[[example]]
name = "spatial_roundtrip"
required-features = ["triblespace"]

[[example]]
name = "spatial_motor"
required-features = ["triblespace"]

[[example]]
name = "spatial_sclerp"

[[example]]
name = "spatial_pga"

[[example]]
name = "polars"
required-features = ["polars"]

[[example]]
name = "entity_inspector"
required-features = ["triblespace"]

[[example]]
name = "schema_inspector"
required-features = ["triblespace"]

[[example]]
name = "incremental_collection"
required-features = ["triblespace"]

[[example]]
name = "minla"
required-features = ["cubecl", "plots"]

[[example]]
name = "dashboard_widgets"
required-features = ["plots"]

[[example]]
name = "spatial_resolver"

[[example]]
name = "spatial_pile_resolver"
required-features = ["triblespace"]


# Debug info was 94.7% of a debug binary here: the `trible` test binary
# measured 1.97 GB, of which only 110 MB was code. Cargo never collects old
# hash-suffixed generations either, so that multiplied until one target/ tree
# reached 728 GB and filled the disk. `panicked at file.rs:12:3` comes from
# `#[track_caller]`, not DWARF, so it survives this; what goes is file:line
# inside RUST_BACKTRACE frames, and gdb locals.
[profile.dev]
debug = 0

# SOURCE-BUILD-ONLY: same tested network readiness repair.
# Registry consumers intentionally use upstream netwatch without these fixes.
[patch.crates-io]
netwatch = { git = "https://github.com/erlkonig-ai/net-tools.git", rev = "10ab7b328809103be74f6ca24258249715fae52b" }
